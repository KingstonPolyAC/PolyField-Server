<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: "PolyField Server — Manual" }}</title>
<meta name="description" content="{{ page.description }}" />
<style>
  :root{
    color-scheme: light dark;
    /* Light theme (default) */
    --navy:#ffffff; --navy2:#f2f6fa; --panel:#eaf1f8; --line:#d6dee7;
    --blue:#1565c0; --blue-d:#0d47a1; --text:#21303f; --muted:#5b6b7b; --amber:#b9770e;
    --heading:#0d2438; --strong:#0a1a2a; --codebg:#eef2f6; --codetext:#0b5cad;
  }
  /* Dark theme — follow the OS unless the reader forced light */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0d1b2a; --navy2:#0f2233; --panel:#12293d; --line:#1e3a52;
      --blue:#4aa3ef; --blue-d:#1465c0; --text:#dbe6f0; --muted:#8fa9c0; --amber:#f5a623;
      --heading:#eaf2fb; --strong:#f0f6fc; --codebg:#0a1420; --codetext:#a8d4ff;
    }
  }
  /* Explicit toggle override */
  :root[data-theme="dark"]{
    --navy:#0d1b2a; --navy2:#0f2233; --panel:#12293d; --line:#1e3a52;
    --blue:#4aa3ef; --blue-d:#1465c0; --text:#dbe6f0; --muted:#8fa9c0; --amber:#f5a623;
    --heading:#eaf2fb; --strong:#f0f6fc; --codebg:#0a1420; --codetext:#a8d4ff;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--navy);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;font-size:16px}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}

  .page{max-width:860px;margin:0 auto;padding:0 22px 90px}
  header.top{border-bottom:1px solid var(--line);margin-bottom:8px}
  .top .inner{max-width:860px;margin:0 auto;padding:18px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top .dot{width:12px;height:12px;border-radius:50%;background:var(--blue)}
  .top b{font-size:1.05rem;letter-spacing:.02em}
  .top .subtitle{color:var(--muted);font-size:.8rem;margin-left:8px}

  /* Language switcher */
  .langs{margin-left:auto;display:flex;gap:6px}
  .langs a{color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.03em;
    padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:var(--navy2)}
  .langs a:hover{color:var(--text);text-decoration:none;border-color:var(--blue)}
  .langs a.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* Manual tabs (Track / Server) */
  .manuals{display:flex;gap:6px}
  .manuals a{color:var(--muted);font-size:.95rem;font-weight:700;
    padding:5px 14px;border:1px solid var(--line);border-radius:8px;background:var(--navy2)}
  .manuals a:hover{color:var(--text);text-decoration:none;border-color:var(--blue)}
  .manuals a.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* Light/dark toggle button */
  .theme-btn{margin-left:8px;cursor:pointer;background:var(--navy2);border:1px solid var(--line);
    color:var(--muted);border-radius:20px;padding:3px 10px;font-size:.85rem;line-height:1;font-weight:600}
  .theme-btn:hover{color:var(--text);border-color:var(--blue)}

  h1{font-size:2.1rem;margin:.6em 0 .1em;letter-spacing:-.01em}
  h2{font-size:1.4rem;margin:2em 0 .5em;padding-top:.5em;border-top:1px solid var(--line);color:var(--heading)}
  h3{font-size:1.08rem;margin:1.5em 0 .3em;color:var(--heading)}
  p,li{color:var(--text)}
  ul,ol{padding-left:1.3em}
  li{margin:.28em 0}
  strong{color:var(--strong)}
  hr{border:none;border-top:1px solid var(--line);margin:2em 0}

  code{background:var(--codebg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.88em;color:var(--codetext)}
  pre{background:var(--codebg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
  pre code{background:none;border:none;padding:0}

  /* Images (screenshots) */
  img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:14px 0;display:block}
  img[alt=""]{border:none}

  /* Tables */
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.94rem}
  th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
  th{background:var(--panel)}

  /* Blockquote = callout / tip */
  blockquote{border-left:4px solid var(--amber);background:var(--panel);
    border-radius:0 8px 8px 0;padding:10px 16px;margin:16px 0;color:var(--text)}
  blockquote p{margin:.3em 0}
  blockquote strong{color:var(--amber)}

  /* Auto table of contents (kramdown #markdown-toc) */
  #markdown-toc{background:var(--navy2);border:1px solid var(--line);border-radius:10px;
    padding:14px 18px 14px 34px;margin:18px 0 26px;font-size:.92rem}
  #markdown-toc:before{content:"Contents";display:block;margin-left:-16px;margin-bottom:6px;
    color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  body[data-lang="fr"] #markdown-toc:before{content:"Sommaire"}
  body[data-lang="es"] #markdown-toc:before{content:"Contenido"}
  body[data-lang="nl"] #markdown-toc:before{content:"Inhoud"}
  #markdown-toc a{color:var(--muted)}
  #markdown-toc a:hover{color:var(--text)}

  footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
</style>
<script>(function(){try{var t=localStorage.getItem('pf-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>

<body data-lang="{{ page.lang | default: 'en' }}">
  {%- assign L = page.lang | default: 'en' -%}
  <header class="top">
    <div class="inner">
      <span class="dot"></span>
      <nav class="manuals">
        <a href="https://kingstonpolyac.github.io/PolyField-Track/">PolyField&nbsp;Track</a>
        <a href="/PolyField-Server/" class="on">PolyField&nbsp;Server</a>
        <a href="https://kingstonpolyac.github.io/PolyFieldApp/">Android&nbsp;App</a>
      </nav>
      <nav class="langs">
        <a href="/PolyField-Server/"   class="{% if L == 'en' %}on{% endif %}">EN</a>
        <a href="/PolyField-Server/fr/" class="{% if L == 'fr' %}on{% endif %}">FR</a>
        <a href="/PolyField-Server/es/" class="{% if L == 'es' %}on{% endif %}">ES</a>
        <a href="/PolyField-Server/nl/" class="{% if L == 'nl' %}on{% endif %}">NL</a>
      </nav>
      <button id="themeBtn" class="theme-btn" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme">☾</button>
    </div>
  </header>
  <div class="page">
    {{ content }}
    <footer>
      PolyField Server · <a href="https://www.polyfield.co.uk">www.polyfield.co.uk</a>
    </footer>
  </div>
<script>
(function(){var r=document.documentElement;
function cur(){return r.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function upd(){var b=document.getElementById('themeBtn');if(b)b.textContent=cur()==='dark'?'☀':'☾';}
function set(t){r.setAttribute('data-theme',t);try{localStorage.setItem('pf-theme',t);}catch(e){}upd();}
var b=document.getElementById('themeBtn');if(b)b.addEventListener('click',function(){set(cur()==='dark'?'light':'dark');});upd();
})();
</script>
</body>
</html>
